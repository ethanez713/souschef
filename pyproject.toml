[project]
name = "souschef"
version = "0.1.0"
description = "Pantry-aware weekly cooking planner"
requires-python = ">=3.12"

# Direct dependencies are pinned exactly. The full transitive tree is hash-locked
# in requirements.txt (pip-compile --generate-hashes); install with --require-hashes.
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "pydantic-settings==2.14.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "cryptography==49.0.0",
    "pint==0.25.3",
    "rapidfuzz==3.14.5",
    "python-dateutil==2.9.0.post0",
    "pillow==12.3.0",
    "recipe-scrapers==15.11.0",
    "ingredient-parser-nlp==2.7.0",
    "rapidocr-onnxruntime==1.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.0",
    "pip-tools==7.6.0",
]

[project.scripts]
souschef = "souschef.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast tests are the default. Anything touching OCR models, the network, or real
# image corpora is marked and excluded from the default run.
addopts = "-m 'not slow' --strict-markers"
markers = [
    "slow: needs OCR models, large fixtures, or recorded network cassettes",
    "external: hits a real third-party service; never runs in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
