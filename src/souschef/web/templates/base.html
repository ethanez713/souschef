<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}SousChef{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12151a">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
{# Chrome only for signed-in users: the login, setup and join pages have no
   account to sign out of and nowhere to navigate to. #}
{% if user %}
<header class="topbar">
  <a class="brand" href="/">SousChef</a>
  <div class="row" style="gap:10px">
    <a class="muted small" href="/settings">{{ user.display_name }}</a>
    <form method="post" action="/logout" class="inline">
      <button class="link" type="submit">Sign out</button>
    </form>
  </div>
</header>
{% else %}
<header class="topbar">
  <a class="brand" href="/">SousChef</a>
</header>
{% endif %}

{% block content %}{% endblock %}

{% if user %}
<nav class="tabbar">
  <a href="/" class="{{ 'on' if active == 'home' }}"><span>Home</span></a>
  <a href="/pantry" class="{{ 'on' if active == 'pantry' }}"><span>Pantry</span></a>
  <a href="/plan" class="{{ 'on' if active == 'plan' }}"><span>Plan</span></a>
  <a href="/shopping" class="{{ 'on' if active == 'shopping' }}"><span>Shop</span></a>
  <a href="/receipts" class="{{ 'on' if active == 'receipts' }}"><span>Scan</span></a>
</nav>
{% endif %}

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(() => {});
}
</script>
</body>
</html>
