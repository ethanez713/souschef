{% extends "base.html" %}
{% from "icons.html" import icon %}
{% block content %}
<main id="main" class="auth">
  <h1>Sign in</h1>
  {% if error %}<div class="notice bad">{{ icon("triangle-alert", 16) }}<div>{{ error }}</div></div>{% endif %}
  <form method="post" action="/login">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" value="{{ username or '' }}" autofocus required>
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="primary block" type="submit">Sign in</button>
  </form>
  <p class="note">
    Accounts are invite-only. If someone sent you an invite link, open that instead.
  </p>
</main>
{% endblock %}
