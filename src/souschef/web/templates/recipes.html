{% extends "base.html" %}
{% set active = 'recipes' %}
{% block content %}
<main>
  <h1>Recipes</h1>

  <form method="get" action="/recipes" class="field" role="search">
    <input name="q" value="{{ query }}" placeholder="Search recipes" inputmode="search" aria-label="Search recipes"
           autocomplete="off"
           hx-get="/recipes" hx-trigger="input changed delay:200ms, search"
           hx-target="#recipe-list" hx-swap="innerHTML" hx-push-url="true">
  </form>

  <details class="card" {{ 'open' if import_open }}>
    <summary>Import a recipe</summary>
    <form method="post" action="/recipes/import" style="margin-top:var(--sp-4)">
      <div class="field">
        <label for="url">Recipe URL</label>
        <input id="url" name="url" type="url" value="{{ import_url }}" placeholder="https://cooking.nytimes.com/recipes/..." required>
      </div>
      <button class="primary" type="submit">Import</button>
    </form>
    <p class="note">
      NYT Cooking needs your session cookie saved in <a href="/settings">Settings</a>.
      From your phone browser, share a recipe page to SousChef to land here.
    </p>
  </details>

  <div id="recipe-list">
    {% include "recipes_list.html" %}
  </div>
</main>
{% endblock %}
